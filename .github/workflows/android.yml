name: Zyntra AI CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 💡 [ဖုန်းနဲ့ ကူးယူစဉ် ပါလာတတ်သော စာလုံးအမှားများအားလုံးကို အမြစ်ပြတ်ရှင်းရန် အလုံခြုံဆုံး Hex စနစ်ကို သုံးထားပါသည်]
    - name: Force Overwrite Perfect AndroidManifest.xml
      run: |
        mkdir -p app/src/main
        echo "" | xxd -r -p > app/src/main/AndroidManifest.xml
        
        sed -i 's/httpe/http/' app/src/main/AndroidManifest.xml
        sed -i 's/nane/name/g' app/src/main/AndroidManifest.xml
        sed -i 's/strale/style/' app/src/main/AndroidManifest.xml
        sed -i 's/devjce/device/g' app/src/main/AndroidManifest.xml
        sed -i 's/actifity/activity/g' app/src/main/AndroidManifest.xml
        sed -i 's/fikte/filte/g' app/src/main/AndroidManifest.xml
        sed -i 's/applj/appli/g' app/src/main/AndroidManifest.xml
        sed -i 's/hzz/has/g' app/src/main/AndroidManifest.xml
        sed -i 's/696f6e3d2231/696f6e3d2231/g' app/src/main/AndroidManifest.xml
        sed -i 's/696e74656e742d66696b746572/696e74656e742d66696c746572/g' app/src/main/AndroidManifest.xml
        sed -i 's/616374696Z697479/6163746976697479/g' app/src/main/AndroidManifest.xml
        sed -i 's/62617465676f727a/63617465676f7279/g' app/src/main/AndroidManifest.xml
        sed -i 's/616374696f697479/6163746976697479/g' app/src/main/AndroidManifest.xml
        sed -i 's/bategory/category/g' app/src/main/AndroidManifest.xml

    # GitHub Secrets ထဲက OPENAI_API_KEY ကို local.properties ထဲသို့ လုံခြုံစွာ ထည့်သွင်းပေးခြင်း
    - name: Inject API Key into local.properties
      run: |
        echo "OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\"" > local.properties

    # 🛠️ အညွှန်းနံပါတ်များ လုံးဝဖယ်ထုတ်ထားပြီး အမှားကင်းစင်သော gradlew ခွင့်ပြုချက်ကုဒ်တန်း
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Assemble Debug APK)
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zyntra-AI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
