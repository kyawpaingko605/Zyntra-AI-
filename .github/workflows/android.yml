name: Zyntra AI CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 💡 [ဖုန်းနဲ့ ကူးယူစဉ် ပါလာတတ်သော စာလုံးအမှားများအားလုံးကို အမြစ်ပြတ်ရှင်းရန် အလုံခြုံဆုံး Hex စနစ်ကို သုံးထားပါသည်]
    - name: Force Overwrite Perfect AndroidManifest.xml
      run: |
        mkdir -p app/src/main
        echo "" | sed '' | base64 -d > app/src/main/AndroidManifest.xml

    # GitHub Secrets ထဲက OPENAI_API_KEY ကို local.properties ထဲသို့ လုံခြုံစွာ ထည့်သွင်းပေးခြင်း
    - name: Inject API Key into local.properties
      run: |
        echo "OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\"" > local.properties

    # gradlew ခွင့်ပြုချက် ပေးခြင်း
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Assemble Debug APK)
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zyntra-AI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
