name: Zyntra AI CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 🛠️ ၁။ $ လက္ခဏာ ငြိစွန်းမှုမရှိစေရန် single quotes ('EOF') သုံးပြီး app/build.gradle.kts ကို ဆောက်ခြင်း
    - name: Force Generate App Build Gradle
      run: |
        mkdir -p app
        cat << 'EOF' > app/build.gradle.kts
        import java.util.Properties

        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.zyntraai"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.zyntraai"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                
                val localProperties = Properties()
                val localPropertiesFile = rootProject.file("local.properties")
                if (localPropertiesFile.exists()) {
                    localPropertiesFile.inputStream().use { localProperties.load(it) }
                }
                val apiKey = localProperties.getProperty("OPENAI_API_KEY") ?: ""
                
                buildConfigField("String", "OPENAI_API_KEY", "\"$apiKey\"")
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
                buildConfig = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
            
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            
            implementation("com.squareup.retrofit2:retrofit:2.9.0")
            implementation("com.squareup.retrofit2:converter-gson:2.9.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

            implementation("com.github.jeziellago:compose-markdown:0.3.1")
        }
        EOF

    # 🛠️ ၂။ XML Parser စက်ရုပ် လုံးဝ ငြင်းလို့မရအောင် အမှားကင်းစင်သော AndroidManifest.xml ကို ထိုးထည့်ခြင်း
    - name: Inject Perfect AndroidManifest.xml
      run: |
        mkdir -p app/src/main
        echo "" | base64 -d > app/src/main/AndroidManifest.xml

    # 🛠️ ၃။ MainActivity.kt ကို 'EOF' စနစ်ဖြင့် တိကျစွာ ရေးသားခြင်း
    - name: Generate Proper MainActivity.kt
      run: |
        mkdir -p app/src/main/java/com/zyntraai
        cat << 'EOF' > app/src/main/java/com/zyntraai/MainActivity.kt
        package com.zyntraai

        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.animation.animateContentSize
        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.lazy.items
        import androidx.compose.foundation.lazy.rememberLazyListState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.automirrored.filled.Send
        import androidx.compose.material.icons.filled.AccountCircle
        import androidx.compose.material.icons.filled.Star 
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.lifecycle.ViewModel
        import androidx.lifecycle.viewmodel.compose.viewModel
        import dev.jeziellago.compose.markdown.MarkdownText 
        import kotlinx.coroutines.MainScope
        import kotlinx.coroutines.launch
        import retrofit2.Retrofit
        import retrofit2.converter.gson.GsonConverterFactory
        import retrofit2.http.Body
        import retrofit2.http.Header
        import retrofit2.http.POST

        val ZyntraPrimary = Color(0xFF7C4DFF) 
        val ZyntraBackground = Color(0xFF14121F)
        val ZyntraSurface = Color(0xFF211D36)
        val ZyntraBubbleAI = Color(0xFF2A244D)

        data class OpenAIRequest(val model: String = "gpt-3.5-turbo", val messages: List<ApiMessage>)
        data class ApiMessage(val role: String, val content: String)
        data class OpenAIResponse(val choices: List<Choice>)
        data class Choice(val message: ApiMessage)

        interface OpenAiService {
            @POST("v1/chat/completions")
            suspend fun getChatCompletion(@Header("Authorization") apiKey: String, @Body request: OpenAIRequest): OpenAIResponse
        }

        object RetrofitClient {
            val instance: OpenAiService by lazy {
                Retrofit.Builder()
                    .baseUrl("https://openai.com")
                    .addConverterFactory(GsonConverterFactory.create())
                    .build()
                    .create(OpenAiService::class.java)
            }
        }

        data class ChatMessage(val id: String, val text: String, val isUser: Boolean)

        class ChatViewModel : ViewModel() {
            var messages by mutableStateOf(listOf<ChatMessage>())
            var isLoading by mutableStateOf(false)
            private val apiKey = "Bearer ${BuildConfig.OPENAI_API_KEY}" 

            fun sendMessage(text: String, onComplete: () -> Unit) {
                val userMessage = ChatMessage(id = System.nanoTime().toString(), text = text, isUser = true)
                messages = messages + userMessage
                isLoading = true
                onComplete()

                MainScope().launch {
                    try {
                        val apiMessages = messages.map { ApiMessage(role = if (it.isUser) "user" else "assistant", content = it.text) }
                        val response = RetrofitClient.instance.getChatCompletion(apiKey, OpenAIRequest(messages = apiMessages))
                        val aiResponseText = response.choices.firstOrNull()?.message?.content ?: "Error"
                        messages = messages + ChatMessage(id = System.nanoTime().toString(), text = aiResponseText, isUser = false)
                    } catch (e: Exception) {
                        messages = messages + ChatMessage(id = System.nanoTime().toString(), text = "ချိတ်ဆက်မှု မအောင်မြင်ပါ", isUser = false)
                    } finally {
                        isLoading = false
                        onComplete()
                    }
                }
            }
        }

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme {
                        val myViewModel: ChatViewModel = viewModel()
                        ZyntraMainScreen(myViewModel)
                    }
                }
            }
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun ZyntraMainScreen(viewModel: ChatViewModel) {
            var inputMessage by remember { mutableStateOf("") }
            val listState = rememberLazyListState()
            val coroutineScope = rememberCoroutineScope()

            Scaffold(
                topBar = {
                    TopAppBar(
                        title = {
                            Row(verticalAlignment = Alignment.CenterVertically) {
