name: Zyntra AI CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 💡 [ဒီအဆင့်က build.gradle.kts ထဲသို့ လိုအပ်သော Library အားလုံးကို အလိုအလျောက် ရေးထည့်ပေးမှာပါ]
    - name: Generate Proper App Build Gradle
      run: |
        mkdir -p app
        cat << 'EOF' > app/build.gradle.kts
        import java.util.Properties

        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.ai.zyntraai"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.ai.zyntraai"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                
                val localProperties = Properties()
                val localPropertiesFile = rootProject.file("local.properties")
                if (localPropertiesFile.exists()) {
                    localPropertiesFile.inputStream().use { localProperties.load(it) }
                }
                val apiKey = localProperties.getProperty("OPENAI_API_KEY") ?: ""
                
                buildConfigField("String", "OPENAI_API_KEY", "\"$apiKey\"")
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
                buildConfig = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            
            // ViewModel + Compose integration
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
            
            // Jetpack Compose UI
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            
            // Networking & Coroutines
            implementation("com.squareup.retrofit2:retrofit:2.9.0")
            implementation("com.squareup.retrofit2:converter-gson:2.9.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

            // Markdown rendering library (Error တက်နေသော နှလုံးသားဖိုင်)
            implementation("com.github.jeziellago:compose-markdown:0.3.1")
        }
        EOF

    # 💡 စက်ရုပ်ကိုယ်တိုင် အမှားကင်းစင်သော AndroidManifest.xml ဖိုင်ကို ရေးသားခြင်း
    - name: Generate Solid AndroidManifest.xml
      run: |
        mkdir -p app/src/main
        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
        echo '<manifest xmlns:android="http://android.com">' >> app/src/main/AndroidManifest.xml
        echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
        echo '    <application android:allowBackup="true" android:label="Zyntra AI" android:supportsRtl="true">' >> app/src/main/AndroidManifest.xml
        echo '        <activity android:name="com.ai.zyntraai.MainActivity" android:exported="true" android:theme="@style/Theme.Material3.Dark.NoActionBar">' >> app/src/main/AndroidManifest.xml
        echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
        echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
        echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
        echo '        </activity>' >> app/src/main/AndroidManifest.xml
        echo '    </application>' >> app/src/main/AndroidManifest.xml
        echo '</manifest>' >> app/src/main/AndroidManifest.xml

    - name: Inject API Key into local.properties
      run: |
        echo "OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\"" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Assemble Debug APK)
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zyntra-ai-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
