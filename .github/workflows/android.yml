name: Zyntra AI CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 💡 စာလုံးပေါင်းအမှားများ ကင်းစင်ပြီး တိုက်ရိုက် အလုပ်လုပ်မည့် သန့်ရှင်းသော Manifest ဖန်တီးမှု
    - name: Force Overwrite Perfect AndroidManifest.xml
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                
                <activity
                    android:name="com.zyntraai.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    # GitHub Secrets ထဲက OPENAI_API_KEY ကို local.properties ထဲသို့ လုံခြုံစွာ ထည့်သွင်းပေးခြင်း
    - name: Inject API Key into local.properties
      run: |
        echo "OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\"" > local.properties

    # gradlew ခွင့်ပြုချက် ပေးခြင်း
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Assemble Debug APK)
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zyntra-AI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
