name: Zyntra AI CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 💡 [တရားခံအစစ်ကို အပိုင်နှိမ်နင်းခြင်း] Linux ရဲ့ $ နှောင့်ယှက်မှု မခံရအောင် အမှားကင်းစင်သော Manifest ကို Base64 စစ်စစ်ဖြင့် ထိုးထည့်ခြင်း
    - name: Inject Valid AndroidManifest.xml (Base64 Safe Mode)
      run: |
        mkdir -p app/src/main
        echo "" | base64 -d > app/src/main/AndroidManifest.xml

    - name: Inject API Key into local.properties
      run: |
        echo "OPENAI_API_KEY=\"${{ secrets.OPENAI_API_KEY }}\"" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Assemble Debug APK)
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zyntra-AI-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
